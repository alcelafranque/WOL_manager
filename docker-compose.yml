services:
  bot:
    image: ghcr.io/littleengineertt/wol_manager:latest
    build: .
    container_name: wol-bot
    # Host networking is required to broadcast magic packets and read the
    # neighbour table of the local network.
    network_mode: host
    env_file: .env
    volumes:
      - wol-data:/data
    restart: unless-stopped

volumes:
  wol-data:
