name: ci
on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: wol-bot:ci
      - name: Check network tools in the image
        run: |
          docker run --rm --cap-drop ALL --cap-add NET_RAW --sysctl net.ipv4.ping_group_range="1 0" \
            --entrypoint sh wol-bot:ci -c 'ip neigh show && ping -c 1 -W 1 127.0.0.1'
